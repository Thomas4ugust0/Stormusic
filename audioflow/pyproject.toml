[project]
name = "audioflow"
version = "1.0.0"
description = "AudioFlow API - extração de áudio de vídeos públicos do YouTube, sem anúncios."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3",
  "celery[redis]==5.4.0",
  "redis==5.2.1",
  "structlog==24.4.0",
  "prometheus-client==0.21.1",
  "yt-dlp[default]==2026.8.19",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "fakeredis==2.26.2",
  "httpx==0.28.1",
  "ruff==0.8.4",
  "mypy==1.14.1",
  "bandit==1.8.0",
  "pip-audit==2.7.3",
  "openapi-spec-validator==0.7.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: testes que acessam a internet (desativados por padrão)"]
addopts = "-m 'not network' --cov=app --cov-report=term-missing"

[tool.coverage.run]
omit = ["app/tasks/celery_app.py", "app/cli.py"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
